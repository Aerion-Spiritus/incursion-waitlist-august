---
categories:
  # List of categories and what skills are in it. All skills must be in one category.
  Tank:
    - Armor Layering
    - EM Armor Compensation
    - Explosive Armor Compensation
    - Thermal Armor Compensation
    - Kinetic Armor Compensation
    - Hull Upgrades
    - Mechanics
    - Shield Management
    - Shield Operation
  Gunnery:
    - Controlled Bursts
    - Motion Prediction
    - Rapid Firing
    - Sharpshooter
    - Surgical Strike
    - Trajectory Analysis
    - Large Energy Turret
    - Large Pulse Laser Specialization
    - Large Hybrid Turret
    - Large Blaster Specialization
    - Medium Energy Turret
    - Gunnery
  Navigation:
    - Navigation
    - Spaceship Command
    - Acceleration Control
    - Evasive Maneuvering
    - High Speed Maneuvering
    - Warp Drive Operation
    - Micro Jump Drive Operation
    - Afterburner
    - Fuel Conservation
  Drones:
    - Drones
    - Gallente Drone Specialization
    - Drone Durability
    - Drone Navigation
    - Drone Avionics
    - Advanced Drone Avionics
    - Drone Interfacing
    - Drone Sharpshooting
    - Electronic Warfare
    - Light Drone Operation
    - Medium Drone Operation
    - Heavy Drone Operation
    - Repair Drone Operation
  Engineering:
    - Thermodynamics
    - Capacitor Management
    - CPU Management
    - Capacitor Systems Operation
    - Power Grid Management
    - Nanite Interfacing
    - Nanite Operation
    - Energy Grid Upgrades
    - Weapon Upgrades
    - Advanced Weapon Upgrades
    - Propulsion Jamming
    - Sensor Linking
    - Frequency Modulation
    - Long Distance Jamming
    - Capacitor Emission Systems
    - Remote Armor Repair Systems
    - Remote Hull Repair Systems
    - Repair Systems
    - Shield Emission Systems
    - Target Painting
  Targeting:
    - Target Management
    - Advanced Target Management
    - Long Range Targeting
    - Signature Analysis
    - Radar Sensor Compensation
    - Magnetometric Sensor Compensation
  Neural Enhancement:
    - Biology
    - Cybernetics
    - Science
    - Neurotoxin Control
    - Neurotoxin Recovery
  Spaceship Command:
    - Amarr Battleship
    - Gallente Battleship
    - Minmatar Battleship
    - Caldari Battleship
    - Amarr Battlecruiser
    - Gallente Battlecruiser
    - Amarr Cruiser
    - Gallente Cruiser
    - Logistics Cruisers
    - Marauders
    - Command Ships
  Fleet Support:
    - Leadership
    - Wing Command
    - Fleet Command
    - Command Burst Specialist
    - Armored Command
    - Armored Command Specialist
    - Skirmish Command
    - Skirmish Command Specialist
    - Information Command
    - Information Command Specialist
  Rigging:
    - Jury Rigging  
    - Armor Rigging
    - Astronautics Rigging

requirements:
  # Booster skills
  _boosts_generic: &boosts_generic
    Leadership:
      min: 5
    Wing Command:
      min: 4
    Fleet Command:
      elite: 4
    Command Burst Specialist:
      min: 4
      elite: 5

  _boosts_armour: &boosts_armored 
    Armored Command:
      elite: 5
    Armored Command Specialist:
      min: 4
      elite: 5
        
  _boosts_information: &boosts_information
    Information Command:
      min: 5
    Information Command Specialist:
      min: 4
      elite: 5

  _boosts_skirmish: &boosts_skirmish    
    Skirmish Command:
      min: 5
    Skirmish Command Specialist:
      min: 4
      elite: 5


  # Generic skills required by newbee ships
  _newbee: &newbee
    EM Armor Compensation:
      min: 2
    Explosive Armor Compensation:
      min: 2
    Kinetic Armor Compensation:
      min: 2
    Thermal Armor Compensation:
      min: 2      

  # Generic skills required by non-newbee ships
  _generic: &generic
    EM Armor Compensation:
      min: 4
      elite: 5
    Explosive Armor Compensation:
      min: 4
      elite: 5
    Kinetic Armor Compensation:
      min: 4
      elite: 5
    Thermal Armor Compensation:
      min: 4
      elite: 5
    Hull Upgrades:
      min: 5

  _marauder: &marauder
    Advanced Weapon Upgrades:
      min: 5
    Energy Grid Upgrades:
      min: 5
    Marauders:
      min: 1

  # Start of per-ship skills
  Maller:
    <<: [*newbee]
    Amarr Cruiser:
      min: 1
    High Speed Maneuvering:
      min: 1
    Hull Upgrades:
      min: 4
    Mechanics:
      min: 1
    Medium Energy Turret:
      min: 1
    Science:
      min: 3
    Target Painting:
      min: 1
    Trajectory Analysis:
      min: 1    

  Apocalypse:
    <<: [*newbee]
    Amarr Battleship:
      min: 2
    Gunnery:
      min: 5
    Large Energy Turret:
      min: 1
    Micro Jump Drive Operation:
      min: 0
      elite: 4
    Trajectory Analysis:
      min: 1
    High Speed Maneuvering:
      min: 3
      elite: 4
    Mechanics:
      min: 3
    Hull Upgrades:
      min: 4
    Armor Layering:
      min: 1
    Target Painting:
      min: 1
    Jury Rigging:
      min: 3
    Armor Rigging:
      min: 2

  Paladin:
    <<: [*generic, *marauder]
    Amarr Battleship:
      min: 5

  Kronos:
    <<: [*generic, *marauder]
    Gallente Battleship:
      min: 5

  Vindicator:
    <<: [*generic]
    Gallente Battleship:
      min: 4
    Minmatar Battleship:
      min: 4
      elite: 5

  Bhaalgorn:
    <<: [*generic]
    Amarr Battleship:
      min: 4

  Nestor:
    <<: [*generic]
    Amarr Battleship:
      min: 4
    Gallente Battleship:
      min: 1

  Eos:
    <<: [*generic, *boosts_generic, *boosts_armored, *boosts_skirmish]
    Gallente Battlecruiser:
      min: 5

  Damnation:
    <<: [*generic, *boosts_generic, *boosts_armored, *boosts_information]
    Amarr Battlecruiser:
      min: 5    


other:
  # These skills are tracked by the skill_updater in addition
  # to the skills set in the requirements array OR required by fits
  - Amarr Drone Specialization
  - Caldari Drone Specialization
  - Minmatar Drone Specialization
  - Mutated Drone Specialization
